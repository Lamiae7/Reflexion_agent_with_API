services:
  - type: web
    name: reflexion-market-research-api
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: MODEL_NAME
        value: llama-3.3-70b-versatile
      - key: LLM_TEMPERATURE
        value: "0.3"
      - key: TAVILY_MAX_RESULTS
        value: "3"
      - key: MAX_ITERATIONS
        value: "2"
      - key: LOG_LEVEL
        value: INFO
    healthCheckPath: /health
